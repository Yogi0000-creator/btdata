<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Fast Non-Stop QR Scanner</title>
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 15px;
            margin: 0;
        }

        /* Login Box Styles */
        #login-container {
            max-width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #login-container input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        #login-container button {
            width: 95%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        #login-container button:hover {
            background-color: #0056b3;
        }
        #error-msg {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Scanner Box Styles */
        #scanner-container {
            display: none;
            max-width: 500px;
            margin: 0 auto;
        }
        #reader {
            width: 100%;
            border: 2px solid #007bff;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        #scanned-result {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            word-break: break-all;
        }
        .status {
            margin-top: 8px;
            font-size: 14px;
            color: #28a745;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-container">
        <h2>Scanner Login</h2>
        <input type="text" id="username" placeholder="User ID">
        <input type="password" id="password" placeholder="Password">
        <button onclick="checkLogin()">Login</button>
        <div id="error-msg"></div>
    </div>

    <!-- 2. SCANNER SCREEN -->
    <div id="scanner-container">
        <h2>Ultra-Fast QR Scanner</h2>
        <div id="reader"></div>
        <div id="scanned-result">Last Scanned: None</div>
        <div id="status" class="status">Ready to scan...</div>
    </div>

    <script>
        // -------------------------------------------------------------
        // SETTINGS: User ID, Password aur Script URL
        const CORRECT_USER = "admin";
        const CORRECT_PASS = "2519";
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvfptV9RJ5Fq6a5wmZoDwMmDZjeFJ9O0Wnyh0ZwDlzfht1v9fm9GVfkBlXAvejw8XA/exec";
        // -------------------------------------------------------------

        let isProcessing = false;
        let html5QrCode = null;
        let audioCtx = null;

        // Audio Context Unlock
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Login Verify Function
        function checkLogin() {
            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;

            if (userIn === CORRECT_USER && passIn === CORRECT_PASS) {
                initAudio();
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('scanner-container').style.display = 'block';
                startUltraFastScanner();
            } else {
                document.getElementById('error-msg').innerText = "Incorrect User ID or Password!";
            }
        }

        // Instant Beep Sound
        function playBeep() {
            try {
                if (!audioCtx) initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = "sine";
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Send Data to Google Sheet
        function sendDataToGoogleSheet(qrText) {
            document.getElementById('status').innerText = "Saving to Google Sheet...";
            document.getElementById('status').style.color = "#ff9800";
            
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ qrData: qrText })
            })
            .then(() => {
                document.getElementById('status').innerText = "Saved successfully!";
                document.getElementById('status').style.color = "#28a745";
                setTimeout(() => {
                    document.getElementById('status').innerText = "Ready for next scan...";
                    isProcessing = false;
                }, 800); // 0.8 sec Fast Cooldown
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById('status').innerText = "Failed to save data.";
                document.getElementById('status').style.color = "red";
                isProcessing = false;
            });
        }

        // Scan Success Handler
        function onScanSuccess(decodedText) {
            if (isProcessing) return;

            isProcessing = true;
            playBeep();

            document.getElementById('scanned-result').innerText = "Last Scanned: " + decodedText;
            sendDataToGoogleSheet(decodedText);
        }

        // Ultra-Fast Scanner Setup
        function startUltraFastScanner() {
            html5QrCode = new Html5Qrcode("reader", {
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true // Native Browser Acceleration
                }
            });

            const config = {
                fps: 25, // High Frame Rate
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    return {
                        width: Math.floor(minEdge * 0.8),
                        height: Math.floor(minEdge * 0.8)
                    };
                },
                aspectRatio: 1.0
            };

            const cameraConfig = {
                facingMode: "environment", // Back Camera Preferred
                width: { min: 640, ideal: 1280 },
                height: { min: 480, ideal: 720 }
            };

            html5QrCode.start(
                cameraConfig,
                config,
                onScanSuccess,
                () => {} // Fast bypass on frame errors
            ).catch(err => {
                console.error("Camera error:", err);
                document.getElementById('status').innerText = "Camera permission required!";
            });
        }
    </script>
</body>
</html>
