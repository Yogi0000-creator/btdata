<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Stop QR Code Scanner</title>
    <!-- HTML5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }

        /* Login Box Styles */
        #login-container {
            max-width: 350px;
            margin: 50px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #login-container input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        #login-container button {
            width: 95%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        #login-container button:hover {
            background-color: #0056b3;
        }
        #error-msg {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Scanner Box Styles */
        #scanner-container {
            display: none; /* Login hone tak hide rahega */
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        #scanned-result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: green;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-container">
        <h2>Scanner Login</h2>
        <input type="text" id="username" placeholder="User ID">
        <input type="password" id="password" placeholder="Password">
        <button onclick="checkLogin()">Login</button>
        <div id="error-msg"></div>
    </div>

    <!-- 2. SCANNER SCREEN -->
    <div id="scanner-container">
        <h2>Non-Stop Live QR Scanner</h2>
        <div id="reader"></div>
        <div id="scanned-result">Last Scanned: None</div>
        <div id="status" class="status">Ready to scan...</div>
    </div>

    <script>
        // -------------------------------------------------------------
        const CORRECT_USER = "admin";
        const CORRECT_PASS = "2519";
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvfptV9RJ5Fq6a5wmZoDwMmDZjeFJ9O0Wnyh0ZwDlzfht1v9fm9GVfkBlXAvejw8XA/exec";
        // -------------------------------------------------------------

        let isProcessing = false;
        let html5QrcodeScanner = null;
        let audioCtx = null;

        // Login Verify Function
        function checkLogin() {
            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;

            if (userIn === CORRECT_USER && passIn === CORRECT_PASS) {
                // AudioContext initialize on user action (browser restriction workaround)
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('scanner-container').style.display = 'block';
                startScanner();
            } else {
                document.getElementById('error-msg').innerText = "Incorrect User ID or Password!";
            }
        }

        // Beep Sound Function
        function playBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Send Data to Google Sheet
        function sendDataToGoogleSheet(qrText) {
            document.getElementById('status').innerText = "Sending to Google Sheet...";
            
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ qrData: qrText })
            })
            .then(() => {
                document.getElementById('status').innerText = "Saved to Sheet successfully!";
                setTimeout(() => {
                    document.getElementById('status').innerText = "Ready for next scan...";
                    isProcessing = false;
                }, 1000);
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById('status').innerText = "Failed to save data.";
                isProcessing = false;
            });
        }

        // Scan Success Handler
        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;

            isProcessing = true;
            playBeep();

            document.getElementById('scanned-result').innerText = "Last Scanned: " + decodedText;
            sendDataToGoogleSheet(decodedText);
        }

        function onScanFailure(error) {
            // Continuous scanning loop
        }

        // Enhanced Scanner Start Function
        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 15, 
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0,
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    }
                }, 
                false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }
    </script>
</body>
</html>
